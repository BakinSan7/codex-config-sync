name: Feature request
description: Propose a bounded improvement to portability or safety
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What safe cross-device workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and portability impact
      description: Explain new writes, local state, permissions, dependencies, or deletion behavior.
    validations:
      required: true
