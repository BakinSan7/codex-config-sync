name: Bug report
description: Report a reproducible failure without sharing private configuration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, personal `AGENTS.md`, real home paths, private repository URLs, or backup contents. Use placeholders. Security vulnerabilities belong in GitHub private vulnerability reporting.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sanitized command and output
      description: Replace user names, repository names, and paths with placeholders.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal instructions, private URLs, and real user paths.
          required: true
